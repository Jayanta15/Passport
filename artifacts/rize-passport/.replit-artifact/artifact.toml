kind = "web"
previewPath = "/"
title = "Rize Passport"
description = "A data-driven export readiness cockpit for Indian SMBs that reveals latent international demand, computes market verdicts, maps HS-code regulatory gates, orchestrates launch steps, and recommends market pricing."
version = "1.0.0"
id = "artifacts/rize-passport"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23421

[services.development]
run = "pnpm --filter @workspace/rize-passport run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rize-passport", "run", "build" ]
serve = "static"
publicDir = "artifacts/rize-passport/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23421"
BASE_PATH = "/"
